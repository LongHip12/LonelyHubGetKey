<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Step {{ step }}/{{ total }} — Lonely Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css?v=7" />
<link rel="stylesheet" href="/static/extras.css?v=7" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .verify-overlay { display:none !important; }
  .step-card { max-width:520px; margin:80px auto 40px; padding:32px 26px; }
  .step-pill { display:inline-block; background:linear-gradient(135deg,#ef4444,#7c3aed); color:#fff; padding:6px 14px; border-radius:20px; font-weight:700; font-size:13px; letter-spacing:.04em; }
  .step-title { font-size:24px; font-weight:800; color:#fff; margin:14px 0 6px; }
  .step-sub { color:rgba(255,255,255,.7); font-size:14px; margin-bottom:20px; }
  .captcha-host { display:flex; justify-content:center; margin:14px 0; min-height:78px; }
  .modal-btn { width:100%; padding:14px; border-radius:12px; border:none; background:linear-gradient(135deg,#ef4444,#7c3aed); color:#fff; font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; transition:transform .15s, opacity .15s; }
  .modal-btn:disabled { opacity:.55; cursor:not-allowed; }
  .modal-btn:not(:disabled):hover { transform:translateY(-1px); }
  .step-status { text-align:center; margin-top:12px; font-size:13px; color:#fff; opacity:.85; min-height:18px; }
  .progress-row { display:flex; gap:6px; justify-content:center; margin-top:14px; }
  .progress-dot { width:24px; height:6px; border-radius:3px; background:rgba(255,255,255,.15); }
  .progress-dot.done { background:linear-gradient(135deg,#10b981,#059669); }
  .progress-dot.cur { background:linear-gradient(135deg,#ef4444,#7c3aed); }
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="bg-gradient"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<header class="topbar topbar-v2">
  <a href="/" class="brand">
    <img src="https://i.imgur.com/xY7M2iE.jpeg" alt="Lonely Hub" class="logo" onerror="this.outerHTML='<span class=&quot;logo logo-text&quot;>LH</span>'"/>
    <span class="brand-name">Lonely Hub</span>
  </a>
</header>

<main class="container container-narrow">
  <div class="glass card step-card anim-pop">
    <div style="text-align:center">
      <span class="step-pill">Step {{ step }} of {{ total }}</span>
      <h1 class="step-title">Verify to continue</h1>
      <p class="step-sub">Complete both captchas, then click Continue to receive your next short link.</p>
      <div class="progress-row">
        {% for i in range(1, total + 1) %}
          <span class="progress-dot {% if i < step %}done{% elif i == step %}cur{% endif %}"></span>
        {% endfor %}
      </div>
    </div>
    <div class="captcha-host">
      <div class="cf-turnstile" data-sitekey="{{ cf_sitekey }}" data-callback="onCfVerify" data-theme="dark"></div>
    </div>
    <div class="captcha-host">
      <div class="h-captcha" data-sitekey="{{ hcaptcha_sitekey }}" data-callback="onHcVerify" data-theme="dark"></div>
    </div>
    <button id="continueBtn" class="modal-btn" disabled>Solve both captchas</button>
    <div id="status" class="step-status"></div>
  </div>
</main>

<script src="/static/script.js?v=7"></script>
<script>
const SID = "{{ sid }}";
const STEP = {{ step }};
let cfToken = null, hcToken = null;

function refreshBtn(){
  const btn = document.getElementById('continueBtn');
  if (cfToken && hcToken) {
    btn.disabled = false;
    btn.textContent = 'Continue to next link';
  } else if (cfToken) {
    btn.textContent = 'Solve hCaptcha';
  } else if (hcToken) {
    btn.textContent = 'Solve Cloudflare';
  }
}

window.onCfVerify = function(t){ cfToken = t; refreshBtn(); };
window.onHcVerify = function(t){ hcToken = t; refreshBtn(); };

document.getElementById('continueBtn').addEventListener('click', async function(){
  const btn = this;
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = 'Generating next short link...';
  statusEl.textContent = '';
  try {
    const hwid = (window.LonelyHub && LonelyHub.getHwid) ? LonelyHub.getHwid() : '';
    const r = await fetch('/api/v1/auth/getkey/continue', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-HWID': hwid},
      body: JSON.stringify({sessionId: SID, step: STEP, cf_token: cfToken, hcaptcha_token: hcToken})
    });
    const data = await r.json();
    if (data.status === 'ok' && data.shortUrl) {
      statusEl.textContent = 'Redirecting...';
      window.location.href = data.shortUrl;
      return;
    }
    if (data.status === 'blocked' || data.status === 'bypass_detected') {
      window.location.href = '/blocked';
      return;
    }
    statusEl.textContent = 'Error: ' + (data.message || data.status || 'unknown');
    btn.disabled = false;
    btn.textContent = 'Try again';
    cfToken = null; hcToken = null;
    try { window.turnstile && window.turnstile.reset(); } catch(e){}
    try { window.hcaptcha && window.hcaptcha.reset(); } catch(e){}
  } catch (e) {
    statusEl.textContent = 'Network error: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Try again';
  }
});
</script>
</body>
</html>
