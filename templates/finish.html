<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Key — Lonely Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css?v=7" />
<link rel="stylesheet" href="/static/extras.css?v=7" />
<style>
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .verify-overlay { display:none !important; }
  .finish-card { max-width:560px; margin:80px auto 40px; padding:32px 26px; text-align:center; }
  .success-mark { width:78px; height:78px; border-radius:50%; background:linear-gradient(135deg,#10b981,#059669); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:#fff; box-shadow:0 12px 40px rgba(16,185,129,.35); }
  .finish-title { font-size:26px; font-weight:800; color:#fff; margin:6px 0; }
  .finish-sub { color:rgba(255,255,255,.7); font-size:14px; margin-bottom:22px; }
  .key-box { font-family:'JetBrains Mono',monospace; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); padding:16px 14px; border-radius:12px; word-break:break-all; color:#fff; font-size:15px; letter-spacing:.04em; margin-bottom:18px; }
  .key-meta { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; color:rgba(255,255,255,.7); font-size:13px; margin-bottom:20px; }
  .key-meta b { color:#fff; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .modal-btn { flex:1; min-width:180px; padding:13px 18px; border-radius:12px; border:none; background:linear-gradient(135deg,#ef4444,#7c3aed); color:#fff; font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:transform .15s; }
  .modal-btn:hover { transform:translateY(-1px); }
  .modal-btn-ghost { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); }
  .copied-toast { display:inline-block; margin-top:10px; color:#10b981; font-size:13px; opacity:0; transition:opacity .25s; }
  .copied-toast.show { opacity:1; }
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="bg-gradient"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<header class="topbar topbar-v2">
  <a href="/" class="brand">
    <img src="https://i.imgur.com/xY7M2iE.jpeg" alt="Lonely Hub" class="logo" onerror="this.outerHTML='<span class=&quot;logo logo-text&quot;>LH</span>'"/>
    <span class="brand-name">Lonely Hub</span>
  </a>
</header>

<main class="container container-narrow">
  <div class="glass card finish-card anim-pop">
    <div class="success-mark">
      <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
    </div>
    <h1 class="finish-title">Your Key is Ready</h1>
    <p class="finish-sub">Save it now — you can find it again on the My Keys page.</p>
    <div id="keyBox" class="key-box">{{ key }}</div>
    <div class="key-meta">
      <span>Method: <b>{{ method }}</b></span>
      <span>Duration: <b>{{ duration }}</b></span>
    </div>
    <div class="actions">
      <button id="copyBtn" class="modal-btn">Copy Key</button>
      <a href="/mykeys" class="modal-btn modal-btn-ghost">Open My Keys</a>
    </div>
    <div id="copied" class="copied-toast">Copied to clipboard</div>
  </div>
</main>

<script>
const KEY_VALUE = {{ key | tojson }};
const KEY_DURATION = {{ duration | tojson }};
const KEY_METHOD = {{ method | tojson }};
const KEY_EXPIRE = {{ expire_at | tojson }};

document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(KEY_VALUE);
    const t = document.getElementById('copied');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  } catch(e) {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('keyBox'));
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    document.execCommand('copy');
  }
});

try {
  const list = JSON.parse(localStorage.getItem('lonely_keys') || '[]');
  if (!list.some(x => x && x.key === KEY_VALUE)) {
    list.unshift({
      key: KEY_VALUE,
      duration: KEY_DURATION,
      method: KEY_METHOD,
      expireAt: KEY_EXPIRE,
      createdAt: Date.now()
    });
    localStorage.setItem('lonely_keys', JSON.stringify(list.slice(0, 50)));
  }
} catch(e) {}
</script>
</body>
</html>
